java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javadoc {
    failOnError = false
}

dependencies {
    api project(':javers-spring')
    api project(':javers-persistence-mongo')
    implementation "org.mongodb:mongodb-driver-sync:$mongoDbDriverVersion"

    optionalImplementation "org.springframework.data:spring-data-mongodb:$springDataMongoVersion"

    testImplementation "org.springframework:spring-test:$springVersion"
    testImplementation "org.springframework.data:spring-data-mongodb:$springDataMongoVersion"
    testImplementation "org.spockframework:spock-spring:$spockVersion"
    testImplementation "org.springframework.security:spring-security-core:$springSecurityVersion"
    testImplementation "com.google.guava:guava:$guavaVersion"

    testImplementation project(path: ":javers-core", configuration: "testArtifacts")
    testImplementation project(path: ":javers-persistence-mongo", configuration: "testArtifacts")
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    testImplementation "org.testcontainers:testcontainers-mongodb:$testcontainers"
    testImplementation "org.testcontainers:testcontainers-spock:$testcontainers"
}
